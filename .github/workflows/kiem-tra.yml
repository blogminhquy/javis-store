# Kiểm mọi gói trước khi trộn vào kho.
#
# Vì sao kho cần CI dù nó chỉ là dữ liệu: gói trong đây tới máy người dùng mà KHÔNG qua một bản
# Javis mới. Không có lần phát hành nào đứng chắn phía sau, nên chỗ chắn duy nhất là đây.
#
# Không cài gì cả - `tools/kiem-tra.py` chỉ dùng thư viện chuẩn. Chạy hết trong vài giây.
name: Kiểm kho

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kiểm cấu trúc gói, an toàn quyền, và danh mục
        run: python tools/kiem-tra.py

      # Phần tự sửa truy vấn của gói TTS Dropship chỉ chạy vào đúng lúc sàn vừa đổi lược đồ,
      # tức lúc không ai chạy thử được. Bộ ca này giả câu lỗi và lược đồ để nó vẫn được chạy.
      - name: Thử phần tự sửa lược đồ GraphQL của TTS Dropship
        run: python tools/thu-tts-tu-sua.py
