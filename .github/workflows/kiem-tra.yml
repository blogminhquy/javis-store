# Kiểm mọi gói trước khi trộn vào kho.
#
# Vì sao kho cần CI dù nó chỉ là dữ liệu: gói trong đây tới máy người dùng mà KHÔNG qua một bản
# Javis mới. Không có lần phát hành nào đứng chắn phía sau, nên chỗ chắn duy nhất là đây.
#
# Không cài gì cả - `tools/kiem-tra.py` chỉ dùng thư viện chuẩn. Chạy hết trong vài giây.
name: Kiểm kho

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Gói có mã gọi vào module của lõi Javis (zalo_cli, image_vision...). Lõi đổi mà gói gãy thì phải
  # biết trong một ngày, không phải đợi tới lúc có người sửa kho.
  schedule:
    - cron: "17 2 * * *"

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kiểm cấu trúc gói, an toàn quyền, và danh mục
        run: python tools/kiem-tra.py

  # Test của gói CÓ MÃ (tests/<id gói>/test_*.py). Plugin trong gói chạy BÊN TRONG máy chủ Javis và import
  # module của nó, nên test chạy trên bản javis-os mới nhất (nhánh main).
  test-goi-co-ma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: blogminhquy/javis-os
          path: javis-os
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện của Javis OS
        run: pip install -r javis-os/requirements.txt
      - name: Chạy test các gói có mã
        env:
          JAVIS_OS_DIR: ${{ github.workspace }}/javis-os
        run: |
          set -e
          shopt -s nullglob
          for f in tests/*/test_*.py; do echo "== $f"; python "$f"; done
