format: javis-pack
spec: 1
id: javis.noi-dung-social
version: 1.0.1
name:
  vi: Nội dung & mạng xã hội
  en: Content & social
description:
  vi: '4 trợ lý và 3 quy trình làm nội dung: từ một ý tưởng ra bài đăng hoàn chỉnh, bẻ bài dài thành chuỗi
    post, và lên lịch nội dung một tháng. Có bước tìm góc tiếp cận trước khi viết, và bước biên tập cắt
    chữ thừa sau khi viết.'
  en: '4 agents and 3 workflows for content: turn one idea into a finished post, split a long piece into
    a post series, and plan a month of content. Angle-finding before writing, editing after.'
author: {name: Javis}
license: MIT
homepage: "https://github.com/blogminhquy/javis-store"
compat: {app: ">=0.55.27"}
provides:
  agents: [nd-goc-nhin, nd-viet-bai, nd-bien-tap, nd-kiem-chung]
  workflows: [y-tuong-thanh-bai-dang, bai-dai-thanh-chuoi-post, lich-noi-dung-thang]
