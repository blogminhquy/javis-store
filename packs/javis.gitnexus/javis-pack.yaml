name: {vi: "GitNexus: Bản đồ mã nguồn", en: "GitNexus: Code knowledge graph"}
description: {vi: "12 skill của GitNexus: dựng đồ thị phụ thuộc của cả codebase rồi dùng nó để khám phá mã, gỡ lỗi, đánh giá tác động trước khi sửa, refactor, review PR. Cần chạy npx gitnexus analyze. Giấy phép chỉ cho dùng phi thương mại.",
              en: "12 GitNexus skills: index the whole codebase into a dependency graph and use it to explore code, debug, check impact before an edit, refactor and review PRs. Needs npx gitnexus analyze. Licensed for noncommercial use only."}
author: {name: "Abhigyan Patwari", url: "https://github.com/abhigyanpatwari/GitNexus"}
license: PolyForm-Noncommercial-1.0.0
homepage: "https://github.com/abhigyanpatwari/GitNexus"
compat: {app: ">=0.55.27"}
# Gói theo repo gốc: thư mục skills/ do tools/theo-goc.py chép nguyên văn, đừng sửa tay.
