name: Quản lý khách hàng (CRM)
slug: khach-hang-crm
version: 1.0.0
description: Khách hàng từ mọi kênh chat (Telegram, Zalo Bot, Zalo cá nhân) - danh sách khách, hồ sơ và lịch sử từng người, gắn tag / ghi chú, hội thoại chờ trả lời, thống kê, xuất CSV. Đọc kho hội thoại của Javis, không gọi mạng.
author: Javis
enabled: true
# Mặc định chỉ đọc. Hai tool ghi (gắn tag, xuất CSV) tự khai min_mode safe trong mã: chúng chỉ
# ghi vào kho khách và vào thư mục exports/ của brain, không gửi gì ra ngoài.
min_mode: readonly
tools:
  - crm_khach_hang
  - crm_ho_so_khach
  - crm_hoi_thoai
  - crm_tim_tin
  - crm_cho_tra_loi
  - crm_thong_ke
  - crm_gan_tag
  - crm_xuat_csv
hooks: []
