# Plugin của gói javis.muse. Slug giữ đúng "muse-accounts" của bản cài tay 1.0.0-1.2.0 (AdamDeck), để thư mục dữ liệu
# plugin-data/muse-accounts (chế độ, cửa sổ đăng nhập đã lưu, các lô video) dùng tiếp sau khi chuyển sang gói.
# `version` luôn bằng version của gói (test của gói kiểm).
name: Muse nhiều tài khoản
name_en: Muse multi-account
slug: muse-accounts
version: 1.3.0
description: Nhiều tài khoản Muse chạy qua Muse Gateway trên máy bạn. Hai cách chạy, Gộp (mọi tài khoản cùng chạy, tài khoản hỏng tự tắt) và Luân phiên (mỗi lúc một tài khoản, hỏng thì chuyển tài khoản kế). Tạo nhiều cảnh video song song, tự làm lại cảnh lỗi và tải file về brain theo thứ tự. Cookie dán ở trang của gói, không đi qua chat.
description_en: Several Muse accounts through Muse Gateway on your machine. Two modes, Pool (every account runs, broken accounts switch off) and Rotate (one account at a time, move to the next when it breaks). Renders many video scenes in parallel, retries failed scenes and saves the files to the brain in scene order. Cookies are pasted on the pack's page, never through chat.
author: Javis (từ plugin muse-accounts của AdamDeck)
enabled: true
min_mode: readonly
tools:
- muse_accounts
- muse_batch_video
- muse_batch_status
hooks: []
