name: Zalo mở rộng - gửi ảnh và file, nhóm, đọc ảnh, kết bạn
name_en: "Zalo extras: images and files, groups, read images, friends"
slug: zalo-extras
version: 2.0.0
description: Mọi công cụ Zalo mà MCP chuẩn còn thiếu, gom trong một plugin, bằng chính tài khoản đã quét QR ở trang Kết nối. Gửi ảnh và file kèm lời nhắn. Trong nhóm - tag đúng người (nói tên, Javis tự tìm ID Zalo thật), liệt kê thành viên, tạo, đọc và sửa ghi chú (giữ nguyên ghim), nhắc hẹn, poll. Đọc ảnh người ta gửi (lưu vào attachments/zalo/ của brain, engine không tự xem được ảnh thì nhận lời tả của ChatGPT trên gói đang đăng nhập). Kết bạn - tìm người theo số điện thoại hay username, tìm trong bạn bè theo tên, xem lời mời chờ duyệt và đã gửi, gửi, nhận, từ chối, rút lại lời mời, đổi tên gợi nhớ. Mỗi tool giữ mức quyền riêng - đọc chạy ở mọi mức, lưu ảnh vào brain cần mức Ghi, gửi hay đổi gì trên Zalo cần Toàn quyền.
description_en: "Every Zalo tool the standard MCP lacks, in one plugin, using the very account scanned on the Connections page. Send images and files with a message. In groups: mention the right person (say the name, Javis finds the real Zalo ID), list members, create, read and edit notes (the pin stays), reminders, polls. Read the images people post (saved to the brain's attachments/zalo/; engines that cannot view images get a description from ChatGPT on the plan you are signed in to). Friends: find people by phone or username, search friends by name, see pending and sent requests, send, accept, reject and withdraw requests, set nicknames. Each tool keeps its own level: reading runs at every level, saving photos into the brain needs Write, sending or changing anything on Zalo needs Full."
author: Javis
enabled: true
# The strongest level among the tools, shown on the Plugins page. Each tool declares its own level when it registers
# (see plugin.py), and that per-tool level is the one Javis enforces.
min_mode: full
tools:
  - zalo_send_image
  - zalo_group_members
  - zalo_send_mention
  - zalo_create_note
  - zalo_list_notes
  - zalo_edit_note
  - zalo_create_reminder
  - zalo_create_poll
  - zalo_read_images
  - zalo_find_user
  - zalo_find_phones
  - zalo_search_friends
  - zalo_friend_status
  - zalo_friend_requests
  - zalo_sent_friend_requests
  - zalo_add_friend
  - zalo_accept_friend
  - zalo_reject_friend
  - zalo_undo_friend_request
  - zalo_friend_aliases
  - zalo_set_friend_alias
  - zalo_remove_friend_alias
hooks: []
