name: Đọc ảnh trong nhóm Zalo
name_en: "Read images in Zalo groups"
slug: zalo-read-images
version: 1.0.0
description: Lấy ẢNH người ta gửi trong nhóm Zalo về brain (attachments/zalo/) rồi cho bộ não xem được nội dung ảnh, bằng chính tài khoản đã quét QR ở trang Kết nối. Engine tự xem được ảnh (Claude Code, Codex) mở thẳng file; engine khác nhận lời tả của ChatGPT trên gói đang đăng nhập. Bù đúng chỗ MCP chuẩn của zalo-agent-cli còn thiếu - nó chỉ trả link ảnh và giữ tin 2 giờ.
description_en: "Fetches the IMAGES people post in a Zalo group into the brain (attachments/zalo/) and lets the brain see what is in them, using the very account you scanned on the Connections page. Engines that can view images (Claude Code, Codex) open the file directly; the others get a description from ChatGPT on the plan you are signed in to. Fills exactly what the standard zalo-agent-cli MCP lacks: it only returns an image link and keeps messages for 2 hours."
author: Javis
enabled: true
min_mode: safe
tools:
  - zalo_read_images
hooks: []
