name: {vi: "Scrapling: Skill cào dữ liệu web", en: "Scrapling: Web scraping skill"}
description: {vi: "Skill chính chủ của Scrapling, thư viện cào web hơn 100 nghìn sao: dạy AI viết mã cào đúng API mới nhất, từ tải một trang, vượt chống bot (Cloudflare), chạy JavaScript, tới spider cào cả site có tạm dừng và chạy tiếp. Cần Python 3.10 trở lên. Dùng tốt nhất với bộ não có shell.",
              en: "The official skill for Scrapling, the 100k-star web scraping library: teaches the AI to write scrapers against the current API, from a single fetch, anti-bot bypass (Cloudflare) and JavaScript rendering to full-site spiders with pause and resume. Needs Python 3.10+. Works best on an engine with a shell."}
