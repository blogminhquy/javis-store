id: javis.agency.zk-steward
version: 1.0.0
name: {vi: "Người giữ kho tri thức Zettelkasten", en: "ZK Steward"}
description: {vi: "Quản kho tri thức theo tinh thần Zettelkasten của Luhmann, đổi góc nhìn chuyên gia (Feynman, Munger, Ogilvy...) theo việc. Ghi chú nguyên tử, liên kết và vòng kiểm chứng.",
              en: "Knowledge-base steward in the spirit of Niklas Luhmann's Zettelkasten. Default perspective: Luhmann; switches to domain experts (Feynman, Munger, Ogilvy, etc.) by task. Enforces atomic notes, connectivity, and validation loops. Use for knowledge-base building, note linking, complex task..."}
author: {name: "msitarzewski", url: "https://github.com/msitarzewski/agency-agents"}
license: MIT
homepage: "https://github.com/msitarzewski/agency-agents/blob/main/specialized/zk-steward.md"
compat: {app: ">=0.55.27"}
