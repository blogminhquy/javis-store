format: javis-pack
spec: 1
id: javis.playwright
version: 1.0.0
name: {vi: "Playwright", en: "Playwright"}
description: {vi: "Điều khiển trình duyệt thật qua Playwright MCP chính chủ của Microsoft: mở trang, đọc cấu trúc trang, tìm phần tử, điền form, bấm nút, chụp màn hình, xuất PDF, quay video, chạy kiểm thử đầu-cuối. Không cần API key. Mặc định chạy hồ sơ TÁCH BIỆT và ẩn cửa sổ.",
              en: "Drive a real browser through Microsoft's official Playwright MCP: open pages, read page structure, fill forms, click, screenshot, export PDF, record video, run end-to-end tests. No API key. Defaults to an isolated, headless profile."}
author: {name: "Microsoft", url: "https://github.com/microsoft/playwright-mcp"}
license: Apache-2.0
homepage: "https://github.com/microsoft/playwright-mcp"
compat: {app: ">=0.55.27"}
provides:
  connectors: [connectors/playwright.json]
